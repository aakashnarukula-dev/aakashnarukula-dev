# Copy to config.yaml and edit. Secrets live in .env, not here.
# ${VAR} placeholders are filled in from the environment at load time.

timezone: Asia/Kolkata

call:
  max_attempts: 2            # first call + one retry
  retry_delay_seconds: 300   # retry 5 minutes after a missed call
  ring_timeout_seconds: 30   # how long to let the phone ring
  # speech   -> they answer in their own words and a model reads what they
  #             meant; the keypad still works as a fallback (needs PUBLIC_BASE_URL)
  # dtmf     -> a keypress is required (needs PUBLIC_BASE_URL)
  # answered -> simply picking up counts (works with no public URL)
  confirmation_mode: speech
  confirm_digit: "1"
  gather_timeout_seconds: 8  # how long to wait for a reply after the message
  speech_timeout: auto       # Twilio end-of-speech detection
  max_snoozes: 1             # honour "call me back in 20 minutes" this many times
  stale_call_seconds: 180    # if no webhook resolves a call by then, poll the provider

# Which model reads the spoken replies. Any of these providers works; see the
# README for the cost and latency comparison behind this default.
#   gemini | openai | groq | xai | deepseek | mistral | anthropic | custom
llm:
  enabled: true
  provider: gemini
  model: gemini-2.5-flash-lite
  timeout_seconds: 8         # someone is holding a phone: fall back, don't stall
  max_tokens: 300
  default_snooze_minutes: 15 # used when they say "later" without saying how long
  max_snooze_minutes: 60

telegram:
  enabled: true
  bot_token: ${TELEGRAM_BOT_TOKEN}
  chat_id: ${TELEGRAM_CHAT_ID}
  notify_on_acknowledged: false   # set true to also get a ping when they confirm

database_path: data/reminders.db

recipients:
  - id: mom
    name: Amma
    phone: ${MOM_PHONE}        # E.164, e.g. +919876543210
    language: te-IN
    # Amazon Polly has no Telugu voice — only Hindi and Indian English. Telugu
    # comes from Google's voices instead. Standard is cheapest; swap in
    # Google.te-IN-Chirp3-HD-Kore for a noticeably more natural read.
    voice: Google.te-IN-Standard-Female
    # Everything the call says besides the reminder. The voice pronounces
    # whatever text it is handed, so leaving these in English would have a
    # Telugu voice reading English aloud.
    phrases:
      confirm_prompt: "మీరు మాత్ర వేసుకున్నారా? చెప్పండి, లేదా {digit} నొక్కండి."
      thanks: "ధన్యవాదాలు. జాగ్రత్తగా ఉండండి."
      no_reply: "సమాధానం రాలేదు. కొద్దిసేపటి తర్వాత మళ్ళీ ఫోన్ చేస్తాను."
      snooze_ack: "సరే, కొద్దిసేపటి తర్వాత మళ్ళీ ఫోన్ చేస్తాను."
      refused_ack: "సరే. నేను ఇంట్లో వాళ్ళకి చెప్తాను."
      unclear_ack: "క్షమించండి, వినిపించలేదు. మళ్ళీ ఫోన్ చేస్తాను."

  - id: dad
    name: Nanna
    phone: ${DAD_PHONE}
    language: te-IN
    voice: Google.te-IN-Standard-Male
    phrases:
      confirm_prompt: "మీరు మాత్ర వేసుకున్నారా? చెప్పండి, లేదా {digit} నొక్కండి."
      thanks: "ధన్యవాదాలు. జాగ్రత్తగా ఉండండి."
      no_reply: "సమాధానం రాలేదు. కొద్దిసేపటి తర్వాత మళ్ళీ ఫోన్ చేస్తాను."
      snooze_ack: "సరే, కొద్దిసేపటి తర్వాత మళ్ళీ ఫోన్ చేస్తాను."
      refused_ack: "సరే. నేను ఇంట్లో వాళ్ళకి చెప్తాను."
      unclear_ack: "క్షమించండి, వినిపించలేదు. మళ్ళీ ఫోన్ చేస్తాను."

schedules:
  - id: morning
    recipient: mom
    at: "08:00"
    message: "నమస్కారం అమ్మా. మీ ఉదయం మాత్రలు టిఫిన్ తర్వాత వేసుకోండి."

  - id: afternoon
    recipient: mom
    at: "14:00"
    days: [mon, tue, wed, thu, fri]
    message: "అమ్మా, మధ్యాహ్నం మాత్ర వేసుకునే సమయం అయ్యింది. భోజనం తర్వాత వేసుకోండి."

  - id: night
    recipient: dad
    cron: "30 21 * * *"        # 9:30 PM daily — raw crontab, if you prefer
    message: "నాన్నా, పడుకునే ముందు రాత్రి మందులు వేసుకోండి."
